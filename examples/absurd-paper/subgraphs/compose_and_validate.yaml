name: Compose and Validate Paper
nodes:
  - id: reconcile
    name: Compose Paper
    timeout: 600.0
    llm: reconcile.md

  - id: persist
    name: Persist Paper to Disk
    depends_on: [reconcile]
    output_contract:
      base_directory: output
      required_files:
      - paper.md
    run: [uv, run, --script, '{{workflow_dir}}/../scripts/persist_paper.py', '{{reconcile}}', output/paper.md]

  - id: submission_check
    name: Submission Structural Check
    depends_on: [persist]
    evaluation:
      validator: ../gates/submission_check.py
      threshold: 1.0
      blocking: true
settings:
  worktree: 'off'
  prompts: ../prompts
