name: Compose and Validate Paper
nodes:
  - id: reconcile
    name: Compose Paper
    timeout: 600.0
    llm: reconcile.md

  - id: persist
    name: Persist Paper to Disk
    depends_on: [reconcile]
    outputs:
      files: [output/paper.md]
    run: [uv, run, --script, '{{workflow_dir}}/../scripts/persist_paper.py', '{{reconcile}}', output/paper.md]

  - id: submission_check
    name: Submission Structural Check
    depends_on: [persist]
    run: [python3, '{{workflow_dir}}/../gates/submission_check.py']
settings:
  worktree: 'off'
  prompts: ../prompts
