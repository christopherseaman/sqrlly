name: Absurd Academic Paper
nodes:
  - id: seed_inspiration
    name: Gather Topic Inspirations
    run: [uv, run, --script, '{{workflow_dir}}/scripts/pick_topic.py']

  - id: choose_topic
    name: Synthesize Absurd Research Domain
    depends_on: [seed_inspiration]
    eval:
      llm: ../gates/choose_topic_eval.md
      outputs: {schema: gates/choose_topic_eval.json}
    route:
      - when: eval.absurdity < 0.7 or eval.specificity < 0.7 or eval.methodological_hook < 0.6
        then: retry
        max_attempts: 3
    llm: choose_topic.md

  - id: abstract
    name: Write Abstract
    depends_on: [choose_topic]
    eval:
      llm: ../gates/abstract_multi_dim.md
      outputs: {schema: gates/abstract_multi_dim.json}
    route:
      - when: attempt < 2 and (eval.rigor < 0.7 or eval.humor < 0.6 or eval.buzzwords < 0.5)
        then: retry
    llm: abstract.md

  - id: outline
    name: Section Outline
    depends_on: [abstract]
    eval:
      run: [python3, '{{workflow_dir}}/gates/outline_json.py', '{{output}}']
    llm: outline.md

  - id: intro
    name: Introduction
    depends_on: [abstract, outline]
    llm: intro.md

  - id: methods
    name: Methods
    depends_on: [abstract, outline]
    llm: methods.md

  - id: results
    name: Results
    depends_on: [abstract, outline]
    llm: results.md

  - id: discussion
    name: Discussion
    depends_on: [abstract, outline]
    llm: discussion.md

  - id: paper
    name: Compose & Validate Paper
    depends_on: [abstract, intro, methods, results, discussion]
    workflow:
      file: subgraphs/compose_and_validate.yaml
      with:
        abstract: '{{abstract}}'
        intro: '{{intro}}'
        methods: '{{methods}}'
        results: '{{results}}'
        discussion: '{{discussion}}'

  - id: render_pdf
    name: Render Paper to PDF
    depends_on: [paper]
    outputs:
      files: [output/paper.pdf]
    run: [uv, run, --script, '{{workflow_dir}}/scripts/render_pdf.py', output/paper.md, output/paper.pdf]
settings:
  preamble_file: preamble.md
  worktree: 'off'
  default_timeout: 180.0
  retry_backoff:
  - 5.0
  - 15.0
  max_parallel_jobs: 2
