name: Absurd Academic Paper
nodes:
  - id: seed_inspiration
    name: Gather Topic Inspirations
    run: [uv, run, --script, '{{workflow_dir}}/scripts/pick_topic.py']

  - id: choose_topic
    name: Synthesize Absurd Research Domain
    depends_on: [seed_inspiration]
    evaluation:
      validator: gates/choose_topic_eval.md
      blocking: true
      max_retries: 2
      dimensions:
      - field: absurdity
        min: 0.7
      - field: specificity
        min: 0.7
      - field: methodological_hook
        min: 0.6
    llm: choose_topic.md

  - id: abstract
    name: Write Abstract
    depends_on: [choose_topic]
    evaluation:
      validator: gates/abstract_multi_dim.md
      blocking: false
      max_retries: 1
      dimensions:
      - field: rigor
        min: 0.7
      - field: humor
        min: 0.6
      - field: buzzwords
        min: 0.5
    llm: abstract.md

  - id: outline
    name: Section Outline
    depends_on: [abstract]
    evaluation:
      validator: gates/outline_json.py
      threshold: 1.0
      blocking: true
    llm: outline.md

  - id: intro
    name: Introduction
    depends_on: [abstract, outline]
    llm: intro.md

  - id: methods
    name: Methods
    depends_on: [abstract, outline]
    llm: methods.md

  - id: results
    name: Results
    depends_on: [abstract, outline]
    llm: results.md

  - id: discussion
    name: Discussion
    depends_on: [abstract, outline]
    llm: discussion.md

  - id: paper
    name: Compose & Validate Paper
    depends_on: [abstract, intro, methods, results, discussion]
    workflow:
      file: subgraphs/compose_and_validate.yaml
      with:
        abstract: '{{abstract}}'
        intro: '{{intro}}'
        methods: '{{methods}}'
        results: '{{results}}'
        discussion: '{{discussion}}'

  - id: render_pdf
    name: Render Paper to PDF
    depends_on: [paper]
    output_contract:
      base_directory: output
      required_files:
      - paper.pdf
    run: [uv, run, --script, '{{workflow_dir}}/scripts/render_pdf.py', output/paper.md, output/paper.pdf]
settings:
  preamble_file: preamble.md
  worktree: 'off'
  max_retries: 2
  default_timeout: 180.0
  retry_backoff:
  - 5.0
  - 15.0
  max_parallel_jobs: 2
