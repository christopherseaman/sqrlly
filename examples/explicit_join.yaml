name: Explicit Join
nodes:
  - id: branch_a
    name: Branch A
    run: [echo, A done]

  - id: branch_b
    name: Branch B
    run: [echo, B done]

  - id: branch_c
    name: Branch C
    run: [echo, C done]

  - id: sync
    name: Sync — all branches landed
    depends_on: [branch_a, branch_b, branch_c]

  - id: report
    name: Report combined outputs
    depends_on: [sync, branch_a, branch_b, branch_c]
    run: [echo, 'A={{branch_a|trim}} | B={{branch_b|trim}} | C={{branch_c|trim}}']
