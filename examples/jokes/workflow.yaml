name: "Joke Generator"
version: "0.1.0"

# One `transport: cli` preset (Codex):
#
#   sqrlly run examples/jokes/workflow.yaml

nodes:
  - id: generate
    name: "Generate Jokes"
    evaluation:
      validator: "examples/jokes/gates/validate_jokes.py"
      threshold: 1.0
      blocking: true
      max_retries: 2

    execute:
      url: "examples/jokes/generate.md"
  - id: select
    name: "Select Best Joke"
    depends_on: ["generate"]
    execute:
      url: "examples/jokes/select.md"

settings:
  presets:
    cli:
      transport: cli
      provider: openai
      model: "gpt-5.6-luna"
      default: true
