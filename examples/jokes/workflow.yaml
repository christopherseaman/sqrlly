name: Joke Generator
nodes:
  - id: generate
    name: Generate Jokes
    evaluation:
      validator: gates/validate_jokes.py
      threshold: 1.0
      blocking: true
      max_retries: 2
    llm: generate.md

  - id: select
    name: Select Best Joke
    depends_on: [generate]
    llm: select.md
settings:
  prompts: .
