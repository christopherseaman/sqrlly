name: Pipeline-style authoring
nodes:
  - id: step_one
    name: Step one
    route:
      goto: step_two
    run: [echo, '[step_one]']

  - id: step_two
    name: Step two
    route:
      goto: step_three
    run: [echo, '[step_two] after {{sender_id}}']

  - id: step_three
    name: Step three
    run: [echo, '[step_three] after {{sender_id}}']
