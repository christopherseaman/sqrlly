name: Route Classifier
nodes:
  - id: triage
    name: Triage Ticket
    run: [python3, '{{workflow_dir}}/scripts/triage.py', 'production down on auth-service, urgent']

  - id: decide
    name: Route by category
    depends_on: [triage]
    route:
      - when: triage == 'spam'
        then: drop_spam
      - when: triage == 'urgent'
        then: page_oncall
      - when: triage == 'escalate'
        then: escalate
      - else: standard_queue

  - id: drop_spam
    name: Drop spam
    run: [echo, 'dropped: {{triage}}']

  - id: page_oncall
    name: Page on-call rotation
    run: [echo, 'paged on-call: {{triage}}']

  - id: escalate
    name: Escalate to manager
    run: [echo, 'escalated: {{triage}}']

  - id: standard_queue
    name: Standard queue
    run: [echo, 'queued: {{triage}}']
