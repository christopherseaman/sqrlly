# Run the examples that share this workflow's workdir. Run wave_planner
# separately in a fresh workdir because it writes its own state.json.
# The agent_recovery walkthrough uses a disposable Git repository and pauses for repair.
name: Run All Examples (parallel)
nodes:
  - id: smoke
    name: Smoke test
    workflow: smoke_test.yaml

  - id: jokes
    name: Joke generator
    workflow: jokes/workflow.yaml

  - id: route_classify
    name: Route classifier
    workflow: route_classify/workflow.yaml

  - id: pipeline_style
    name: Pipeline-style authoring
    workflow: pipeline_style/workflow.yaml

  - id: explicit_join
    name: Explicit join
    workflow: explicit_join.yaml

  - id: absurd_paper
    name: Absurd academic paper
    workflow: absurd-paper/workflow.yaml

  - id: run_command
    name: Run a Python script with uv
    workflow: run_command/workflow.yaml
settings:
  max_parallel_jobs: 6
  default_timeout: 600.0
