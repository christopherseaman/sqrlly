name: Wave-driven research planner
nodes:
  - id: planner
    name: Seed initial questions
    run: [python3, '{{workflow_dir}}/scripts/planner.py']

  - id: dispatcher
    name: Dispatch a wave of pending questions
    depends_on: [planner]
    run: [python3, '{{workflow_dir}}/scripts/dispatcher.py']

  - id: workers
    name: Answer each pending question
    depends_on: [dispatcher]
    for_each: dispatcher
    worktree: 'off'
    run: [python3, '{{workflow_dir}}/scripts/worker.py', '{{item.id}}']

  - id: reconcile
    name: Discover follow-up questions
    depends_on: [workers]
    run: [python3, '{{workflow_dir}}/scripts/reconcile.py']

  - id: gate
    name: Loop while reconcile finds new tasks
    depends_on: [reconcile]
    route:
      - when: '''reconcile_added'' in reconcile'
        then: dispatcher
        max_attempts: 10
settings:
  max_parallel_jobs: 2
  memory_threshold_pct: 95.0
