name: "Flow A — Score routing"

nodes:
  - id: produce
    name: produce
    run: [echo, "-n", "draft"]

  - id: judge
    name: judge
    depends_on: [produce]
    evaluation:
      validator: "score_high.py"
      threshold: 0.5
      blocking: false
      max_retries: 0

  - id: decide
    name: decide
    depends_on: [judge]
    route:
      cases:
        - when: "history['judge'][-1]['result']['score'] >= 0.5"
          goto: ship
      else: {goto: __end__}

  - id: ship
    name: ship
    run: [echo, "-n", "shipped"]

settings:
  max_retries: 0
