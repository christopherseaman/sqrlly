name: "Flow A — Score routing"

nodes:
  - id: produce
    name: produce
    run: [echo, "-n", "draft"]

  - id: judge
    name: judge
    depends_on: [produce]
    eval:
      run: [python3, "{{workflow_dir}}/score_high.py"]
    route:
      - when: eval.score >= 0.5
        then: ship

  - id: ship
    name: ship
    run: [echo, "-n", "shipped"]
